<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123B7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AKAIDO Sales System V3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#f4f7fb;color:#172033;-webkit-text-size-adjust:100%}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
a{color:#123B7A}
.top{background:#123B7A;color:#fff;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20}
.topin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px}
.userline{font-size:12px;opacity:.8;margin-top:2px}
.hbtn{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}
.container{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #123b7a0d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{padding:13px;border-radius:12px;background:#fff;border:1px solid #e3ebf7}
.stat b{display:block;font-size:22px;color:#123B7A;word-break:break-word}
.stat span{font-size:12px;color:#667085}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6dbe5;border-radius:9px;margin-bottom:8px;font:inherit;font-size:16px;background:#fff}
textarea{min-height:85px}
label{display:block;font-size:12px;font-weight:700;color:#667085;margin-bottom:3px}
.btn{border:0;border-radius:9px;padding:11px 14px;background:#123B7A;color:#fff;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.secondary{background:#e8eef8;color:#123B7A}
.danger{background:#b42318;color:#fff}
.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.item{border:1px solid #e5e7eb;border-radius:11px;padding:11px;margin-top:8px}
.muted{color:#667085;font-size:13px}
.red{color:#b42318;font-weight:700}
.err{color:#b42318;font-size:13px;margin:8px 0 0}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#7a4b00;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}
.g-A{background:#e8f7ee;color:#16834a}.g-B{background:#fff4d6;color:#a15c00}.g-C{background:#eee;color:#666}
.hidden{display:none!important}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:#fff;padding:9px 3px;font-size:11px;color:#667085}
.nav button.on{color:#123B7A;font-weight:800}
main{padding-bottom:90px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:100%;max-width:420px}
.logo{font-size:34px;font-weight:900;color:#123B7A}
.table{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
td select{margin:0;padding:6px;font-size:13px;width:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>

<div id="login" class="login">
 <div class="loginbox">
  <div class="logo">AKAIDO</div>
  <div class="muted" style="margin:5px 0 18px">SALES MANAGEMENT SYSTEM V3.0 · 云端版</div>
  <div class="card">
   <label for="lu">账号 Username</label>
   <input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
   <label for="lp">密码 Password</label>
   <input id="lp" type="password" autocomplete="current-password">
   <button id="loginBtn" class="btn full" type="button" onclick="doLogin()">登录 LOGIN</button>
   <p id="loginMsg" class="err hidden"></p>
   <p class="muted">账号由管理员创建，不能自行注册。</p>
  </div>
 </div>
</div>

<div id="app" class="hidden">
 <header class="top">
  <div class="container topin" style="padding-top:0;padding-bottom:0">
   <div><b>AKAIDO SALES SYSTEM</b><div id="userline" class="userline"></div></div>
   <div class="row"><button class="hbtn" type="button" onclick="refresh()">↻ 刷新</button><button class="hbtn" type="button" onclick="logout()">退出</button></div>
  </div>
 </header>
 <main class="container">
  <section id="dashboard"></section>
  <section id="checkin" class="hidden"></section>
  <section id="customers" class="hidden"></section>
  <section id="visits" class="hidden"></section>
  <section id="admin" class="hidden"></section>
 </main>
 <nav class="nav">
  <button data-p="dashboard" onclick="page('dashboard')">📊<br>首页</button>
  <button data-p="checkin" onclick="page('checkin')">📍<br>打卡</button>
  <button data-p="customers" onclick="page('customers')">👥<br>客户</button>
  <button data-p="visits" onclick="page('visits')">📝<br>拜访</button>
  <button id="navAdmin" data-p="admin" onclick="page('admin')">⚙️<br>后台</button>
 </nav>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ========== 配置 ========== */
const SUPABASE_URL='https://ukytgdqmhyfeaiecnacr.supabase.co';
const SUPABASE_KEY='sb_publishable_0xvYTyLvmtksPSKTh3-BAQ_rKE0I9RH';   // 公开密钥，可放在网页里；权限由数据库 RLS 控制
const EMAIL_DOMAIN='@akaido-sales.com';

/* ========== 全局状态与工具 ========== */
let sb=null, me=null, cur='dashboard', busy=false;
let D={profiles:[],customers:[],visits:[],attendance:[]};
const PAGES=['dashboard','checkin','customers','visits','admin'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=x=>x?new Date(x).toLocaleString('en-MY',{hour12:false}):'-';
const ftime=x=>x?new Date(x).toLocaleTimeString('en-MY',{hour12:false,hour:'2-digit',minute:'2-digit'}):'-';
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const startOfToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const isToday=x=>new Date(x).getTime()>=startOfToday();
const isAdmin=()=>!!me&&me.role==='admin';
const nameOf=id=>{const p=D.profiles.find(x=>x.id===id);return p?p.name:'-'};
const salesList=()=>D.profiles.filter(p=>p.role==='sales'&&p.active);
const mapLink=(lat,lng)=>(lat==null||lng==null)?'-':'<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+Number(lat)+','+Number(lng)+'">地图</a>';
const gpsText=(lat,lng)=>(lat==null||lng==null)?'-':Number(lat).toFixed(5)+', '+Number(lng).toFixed(5);

let toastTimer;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
async function guard(fn){
  if(busy)return;
  busy=true;
  try{await fn()}catch(e){console.error(e);toast('出错：'+((e&&e.message)?e.message:e))}
  finally{busy=false}
}
function loginMsg(t){const p=$('loginMsg');p.textContent=t||'';p.classList.toggle('hidden',!t)}

/* 潜在订单：每个客户只取「最近一次拜访」填写的金额，避免重复累加 */
function potMap(){const m=new Map();for(const v of D.visits){if(!m.has(v.customer_id))m.set(v.customer_id,Number(v.potential_order||0))}return m}
function potentialFor(ownerId){const m=potMap();let s=0;D.customers.forEach(c=>{if(!ownerId||c.owner_id===ownerId)s+=(m.get(c.id)||0)});return s}

/* ========== 登录 / 退出 ========== */
async function doLogin(){
  loginMsg('');
  if(!sb){loginMsg('无法加载网络组件，请检查网络后刷新页面');return}
  const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;
  if(!u||!p){loginMsg('请输入账号和密码');return}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='登录中…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+EMAIL_DOMAIN,password:p});
    if(error){loginMsg(/invalid login/i.test(error.message)?'账号或密码错误':'登录失败：'+error.message);return}
    await enter(data.user);
  }catch(e){console.error(e);loginMsg('登录失败：'+(e.message||e))}
  finally{btn.disabled=false;btn.textContent='登录 LOGIN'}
}
async function enter(user){
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!prof){await sb.auth.signOut();loginMsg('找不到账号资料，请联系管理员');return}
  if(!prof.active){await sb.auth.signOut();loginMsg('此账号已停用，请联系管理员');return}
  me=prof;
  me.pwdChanged=!!(user.user_metadata&&user.user_metadata.pwd_changed);
  await loadAll();
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('userline').textContent=me.name+' · '+me.role.toUpperCase();
  $('navAdmin').classList.toggle('hidden',!isAdmin());
  page('dashboard');
}
async function logout(){me=null;try{await sb.auth.signOut()}catch(e){}location.reload()}
async function refresh(){await guard(async()=>{await loadAll();page(cur);toast('已刷新')})}

/* ========== 读取数据（数据库 RLS 已按账号过滤：Sales 只会拿到自己的，Admin 拿到全部） ========== */
async function loadAll(){
  const rs=await Promise.all([
    sb.from('profiles').select('*').order('username'),
    sb.from('customers').select('*').order('created_at',{ascending:false}),
    sb.from('visits').select('*').order('created_at',{ascending:false}),
    sb.from('attendance').select('*').order('created_at',{ascending:false}).limit(1000)
  ]);
  for(const r of rs){if(r.error)throw r.error}
  D={profiles:rs[0].data,customers:rs[1].data,visits:rs[2].data,attendance:rs[3].data};
}

/* ========== 页面切换 ========== */
function showSection(p){
  cur=p;
  PAGES.forEach(x=>$(x).classList.toggle('hidden',x!==p));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  window.scrollTo(0,0);
}
function page(p){
  showSection(p);
  ({dashboard:renderDashboard,checkin:renderCheckin,customers:renderCustomers,visits:renderVisits,admin:renderAdmin})[p]();
}

/* ========== 首页 ========== */
function statBox(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>'}
function renderDashboard(){
  const admin=isAdmin();
  const inToday=D.attendance.filter(a=>a.type==='IN'&&isToday(a.created_at));
  const visitsToday=D.visits.filter(v=>isToday(v.created_at));
  const gradeA=D.customers.filter(c=>c.grade==='A').length;
  const due=D.customers.filter(c=>c.follow_up&&c.follow_up<=ymd()).sort((a,b)=>a.follow_up.localeCompare(b.follow_up));
  let stats;
  if(admin){
    const sales=salesList(),checked=new Set(inToday.map(a=>a.user_id));
    stats=statBox(sales.length,'Sales 人数')+statBox(sales.filter(s=>checked.has(s.id)).length+' / '+sales.length,'今日已打卡')+
      statBox(visitsToday.length,'今日拜访')+statBox(D.customers.length,'客户总数')+statBox(gradeA,'A 级客户')+statBox(money(potentialFor()),'潜在订单');
  }else{
    stats=statBox(inToday.length?'已打卡':'未打卡','今日打卡')+statBox(visitsToday.length,'今日拜访')+
      statBox(D.customers.length,'我的客户')+statBox(gradeA,'A 级客户')+statBox(due.length,'待跟进')+statBox(money(potentialFor()),'潜在订单');
  }
  let h='<h2>📊 '+(admin?'管理首页':'我的首页')+'</h2>';
  if(!me.pwdChanged)h+='<div class="banner"><b>⚠️ 请先修改默认密码。</b>当前账号仍在使用初始密码，任何知道账号名的人都可能登录。请在页面最下方的「修改我的密码」修改。</div>';
  h+='<div class="grid">'+stats+'</div><p class="muted" style="margin:-4px 0 12px">潜在订单 = 各客户最近一次拜访所填金额之和。</p>';
  if(admin)h+=salesTable();
  h+='<div class="card"><h3>📅 待跟进客户</h3>'+(due.length?due.slice(0,15).map(c=>
    '<div class="item row between"><div><b>'+esc(c.name)+'</b> <span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+'</span><br><small class="red">跟进日期 '+esc(c.follow_up)+'</small>'+(admin?' <small class="muted">· '+esc(nameOf(c.owner_id))+'</small>':'')+'</div>'+
    '<button class="btn" onclick="visitForm(\''+esc(c.id)+'\')">拜访</button></div>').join(''):'<div class="muted">目前没有到期的跟进</div>')+'</div>';
  h+='<div class="card"><h3>🔒 修改我的密码</h3><input id="pw1" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password"><input id="pw2" type="password" placeholder="再输入一次新密码" autocomplete="new-password"><button class="btn" onclick="changePassword()">保存新密码</button></div>';
  $('dashboard').innerHTML=h;
}
function salesTable(){
  const rows=salesList().map(u=>{
    const ins=D.attendance.filter(a=>a.user_id===u.id&&a.type==='IN'&&isToday(a.created_at)).sort((a,b)=>a.created_at.localeCompare(b.created_at));
    const v=D.visits.filter(x=>x.sales_id===u.id&&isToday(x.created_at)).length;
    const c=D.customers.filter(x=>x.owner_id===u.id).length;
    return '<tr><td>'+esc(u.name)+'</td><td>'+(ins.length?'✅ '+ftime(ins[0].created_at):'—')+'</td><td>'+v+'</td><td>'+c+'</td><td>'+money(potentialFor(u.id))+'</td></tr>';
  }).join('');
  return '<div class="card"><h3>👨‍💼 Sales 今日情况</h3><div class="table"><table><tr><th>Sales</th><th>今日打卡</th><th>今日拜访</th><th>客户数</th><th>潜在订单</th></tr>'+rows+'</table></div></div>';
}
async function changePassword(){
  const a=$('pw1').value,b=$('pw2').value;
  if(a.length<8){toast('新密码至少 8 位');return}
  if(a!==b){toast('两次输入的密码不一致');return}
  if(a==='123456'){toast('不能继续使用 123456');return}
  await guard(async()=>{
    const {error}=await sb.auth.updateUser({password:a,data:{pwd_changed:true}});
    if(error)throw error;
    me.pwdChanged=true;toast('密码已修改，下次请用新密码登录');renderDashboard();
  });
}

/* ========== 打卡 ========== */
function getPos(timeout){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({code:0});
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:timeout||12000,maximumAge:0});
  });
}
function geoMsg(e){return e&&e.code===1?'请允许网页使用定位权限':e&&e.code===2?'无法确定位置，请到信号好的地方重试':e&&e.code===3?'定位超时，请重试':'此浏览器不支持定位（需要 HTTPS 网址）'}
function renderCheckin(){
  const mine=D.attendance.filter(a=>a.user_id===me.id&&isToday(a.created_at));
  const hasIn=mine.some(a=>a.type==='IN');
  let h='<h2>📍 外勤打卡</h2><div class="card"><div class="row"><button class="btn" onclick="attend(\'IN\')">📍 CHECK IN</button><button class="btn secondary" onclick="attend(\'OUT\')">🏁 CHECK OUT</button></div>'+
    '<p class="muted">今日状态：'+(hasIn?'已 Check In':'尚未 Check In')+'。打卡会记录 GPS 位置，请在弹出的提示里选择「允许」。</p></div>';
  h+='<div class="card"><h3>我的今日记录</h3>'+(mine.length?mine.map(a=>
    '<div class="item"><b>'+esc(a.type)+'</b> · '+fmt(a.created_at)+'<br><small>GPS '+gpsText(a.lat,a.lng)+' · 精度 '+(a.accuracy!=null?Math.round(a.accuracy)+'m':'-')+' · '+mapLink(a.lat,a.lng)+'</small></div>').join(''):'<div class="muted">今天还没有打卡记录</div>')+'</div>';
  if(isAdmin()){
    h+='<div class="card"><h3>全部 Sales 打卡记录（最近 100 条）</h3><div class="table"><table><tr><th>Sales</th><th>类型</th><th>时间</th><th>位置</th><th>精度</th></tr>'+
      D.attendance.slice(0,100).map(a=>'<tr><td>'+esc(nameOf(a.user_id))+'</td><td>'+esc(a.type)+'</td><td>'+fmt(a.created_at)+'</td><td>'+mapLink(a.lat,a.lng)+'</td><td>'+(a.accuracy!=null?Math.round(a.accuracy)+'m':'-')+'</td></tr>').join('')+'</table></div></div>';
  }
  $('checkin').innerHTML=h;
}
async function attend(type){
  await guard(async()=>{
    toast('正在获取 GPS…');
    let pos;
    try{pos=await getPos(12000)}catch(e){toast('GPS 无法取得：'+geoMsg(e));return}
    const {error}=await sb.from('attendance').insert({user_id:me.id,type:type,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy});
    if(error)throw error;
    await loadAll();renderCheckin();toast(type==='IN'?'Check In 成功':'Check Out 成功');
  });
}

/* ========== 客户 ========== */
function custList(q){
  const pm=potMap(),admin=isAdmin(),today=ymd();
  const list=D.customers.filter(c=>!q||[c.name,c.contact,c.phone,c.address,admin?nameOf(c.owner_id):''].join(' ').toLowerCase().includes(q));
  if(!list.length)return '<div class="muted" style="margin-top:8px">'+(q?'没有符合的客户':'还没有客户，点上方「新增客户」')+'</div>';
  return list.map(c=>{
    const overdue=c.follow_up&&c.follow_up<=today;
    return '<div class="item"><div class="row between"><b>'+esc(c.name)+'</b><span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+' 级</span></div>'+
      '<small>'+esc(c.contact||'-')+' · '+esc(c.phone||'-')+'</small><br><small>'+esc(c.address||'-')+'</small>'+
      '<div class="muted" style="margin-top:4px">'+(admin?'Sales：'+esc(nameOf(c.owner_id))+' · ':'')+'下次跟进：<span class="'+(overdue?'red':'')+'">'+esc(c.follow_up||'-')+'</span> · 潜在订单 '+money(pm.get(c.id)||0)+'</div>'+
      '<div class="row" style="margin-top:8px"><button class="btn secondary" onclick="showCustomer(\''+esc(c.id)+'\')">详情/历史</button><button class="btn secondary" onclick="customerForm(\''+esc(c.id)+'\')">编辑</button><button class="btn" onclick="visitForm(\''+esc(c.id)+'\')">拜访</button></div></div>';
  }).join('');
}
function filterCustomers(){$('clist').innerHTML=custList($('cq').value.trim().toLowerCase())}
function renderCustomers(){
  $('customers').innerHTML='<h2>👥 客户 CRM</h2><div class="card"><button class="btn full" onclick="customerForm()">＋ 新增客户</button></div>'+
    '<div class="card"><input id="cq" placeholder="搜索客户 / 联系人 / 电话 / 地址" oninput="filterCustomers()"><div id="clist">'+custList('')+'</div></div>';
}
function showCustomer(id){
  showSection('customers');
  const c=D.customers.find(x=>x.id===id);
  if(!c){renderCustomers();return}
  const vs=D.visits.filter(v=>v.customer_id===id);
  const pm=potMap();
  $('customers').innerHTML='<h2>👥 '+esc(c.name)+'</h2>'+
   '<div class="card"><div class="row between"><span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+' 级</span><span class="muted">'+(isAdmin()?'Sales：'+esc(nameOf(c.owner_id)):'')+'</span></div>'+
   '<p>联系人：'+esc(c.contact||'-')+'<br>电话：'+esc(c.phone||'-')+'<br>地址：'+esc(c.address||'-')+'<br>竞品：'+esc(c.competitor||'-')+'<br>产品：'+esc(c.products||'-')+'<br>下次跟进：'+esc(c.follow_up||'-')+'<br>潜在订单：'+money(pm.get(c.id)||0)+'<br>备注：'+esc(c.remarks||'-')+'</p>'+
   '<div class="row"><button class="btn" onclick="visitForm(\''+esc(c.id)+'\')">＋ 新增拜访</button><button class="btn secondary" onclick="customerForm(\''+esc(c.id)+'\')">编辑</button><button class="btn secondary" onclick="renderCustomers()">返回列表</button></div></div>'+
   '<div class="card"><h3>拜访历史（'+vs.length+'）</h3>'+(vs.length?vs.map(v=>visitItem(v,false)).join(''):'<div class="muted">还没有拜访记录</div>')+'</div>';
}
function customerForm(id){
  showSection('customers');
  const c=id?D.customers.find(x=>x.id===id):{name:'',contact:'',phone:'',address:'',grade:'B',competitor:'',products:'',remarks:'',follow_up:'',owner_id:''};
  if(!c){renderCustomers();return}
  const admin=isAdmin();
  let ownerSel='';
  if(admin){
    const opts=D.profiles.filter(p=>(p.role==='sales'&&p.active)||p.id===c.owner_id);
    const sel=c.owner_id||(opts[0]&&opts[0].id)||me.id;
    ownerSel='<label>所属 Sales（可重新分配）</label><select id="c_owner">'+opts.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>';
  }
  $('customers').innerHTML='<h2>👥 '+(id?'编辑':'新增')+'客户</h2><div class="card">'+
   '<label>客户名称 *</label><input id="c_name" value="'+esc(c.name)+'">'+
   '<label>联系人 / 老板</label><input id="c_contact" value="'+esc(c.contact)+'">'+
   '<label>电话</label><input id="c_phone" type="tel" value="'+esc(c.phone)+'">'+
   '<label>客户等级</label><select id="c_grade">'+['A','B','C'].map(g=>'<option'+(c.grade===g?' selected':'')+'>'+g+'</option>').join('')+'</select>'+
   '<label>地址</label><input id="c_addr" value="'+esc(c.address)+'">'+
   '<label>竞品</label><input id="c_comp" value="'+esc(c.competitor)+'">'+
   '<label>使用 / 有兴趣的产品</label><input id="c_prod" value="'+esc(c.products)+'">'+
   '<label>下次跟进日期</label><input id="c_fu" type="date" value="'+esc(c.follow_up||'')+'">'+
   '<label>备注</label><textarea id="c_rem">'+esc(c.remarks)+'</textarea>'+ownerSel+
   '<div class="row"><button class="btn" onclick="saveCustomer('+(id?'\''+esc(id)+'\'':'null')+')">保存</button><button class="btn secondary" onclick="renderCustomers()">取消</button>'+
   (id&&admin?'<button class="btn danger" onclick="deleteCustomer(\''+esc(id)+'\')">删除客户</button>':'')+'</div></div>';
}
async function saveCustomer(id){
  const name=$('c_name').value.trim();
  if(!name){toast('请输入客户名称');return}
  const row={name:name,contact:$('c_contact').value.trim(),phone:$('c_phone').value.trim(),grade:$('c_grade').value,address:$('c_addr').value.trim(),
    competitor:$('c_comp').value.trim(),products:$('c_prod').value.trim(),remarks:$('c_rem').value.trim(),follow_up:$('c_fu').value||null};
  if(isAdmin()&&$('c_owner'))row.owner_id=$('c_owner').value;
  await guard(async()=>{
    let r;
    if(id){r=await sb.from('customers').update(row).eq('id',id)}
    else{if(!row.owner_id)row.owner_id=me.id;r=await sb.from('customers').insert(row)}
    if(r.error)throw r.error;
    await loadAll();renderCustomers();toast('客户已保存');
  });
}
async function deleteCustomer(id){
  if(!confirm('确定删除这个客户？该客户的所有拜访记录也会一起删除，无法恢复。'))return;
  await guard(async()=>{
    const r=await sb.from('customers').delete().eq('id',id);
    if(r.error)throw r.error;
    await loadAll();renderCustomers();toast('客户已删除');
  });
}

/* ========== 拜访 ========== */
function visitItem(v,showCustomer){
  const c=D.customers.find(x=>x.id===v.customer_id);
  return '<div class="item"><b>'+esc(showCustomer?(c?c.name:'（已删除的客户）'):fmt(v.created_at))+'</b>'+
    '<br><small class="muted">'+(showCustomer?fmt(v.created_at)+' · ':'')+esc(nameOf(v.sales_id))+' · 见到老板：'+(v.met_owner?'是':'否')+(v.lat!=null?' · '+mapLink(v.lat,v.lng):'')+'</small>'+
    (v.need?'<br>需求：'+esc(v.need):'')+(v.feedback?'<br>反馈：'+esc(v.feedback):'')+(v.competitor?'<br>竞品/价格：'+esc(v.competitor):'')+
    '<br>潜在订单：<b>'+money(v.potential_order)+'</b>'+(v.next_follow_up?' · 下次跟进：'+esc(v.next_follow_up):'')+'</div>';
}
function renderVisits(){
  const list=D.visits.slice(0,100);
  $('visits').innerHTML='<h2>📝 拜访记录</h2><div class="card"><button class="btn full" onclick="visitPicker()">＋ 新增拜访</button></div>'+
    '<div class="card">'+(list.length?list.map(v=>visitItem(v,true)).join(''):'<div class="muted">还没有拜访记录</div>')+(D.visits.length>100?'<p class="muted">仅显示最近 100 条</p>':'')+'</div>';
}
function pickerList(q){
  const list=D.customers.filter(c=>!q||[c.name,c.contact,c.phone,c.address].join(' ').toLowerCase().includes(q));
  return list.length?list.map(c=>'<div class="item row between"><div><b>'+esc(c.name)+'</b> <span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+'</span><br><small class="muted">'+esc(c.address||'')+'</small></div><button class="btn" onclick="visitForm(\''+esc(c.id)+'\')">开始拜访</button></div>').join(''):'<div class="muted" style="margin-top:8px">没有客户，请先到「客户」页新增</div>';
}
function filterPicker(){$('plist').innerHTML=pickerList($('pq').value.trim().toLowerCase())}
function visitPicker(){
  showSection('visits');
  $('visits').innerHTML='<h2>选择要拜访的客户</h2><div class="card"><input id="pq" placeholder="搜索客户" oninput="filterPicker()"><div id="plist">'+pickerList('')+'</div><button class="btn secondary" style="margin-top:10px" onclick="renderVisits()">返回</button></div>';
}
function visitForm(cid){
  showSection('visits');
  const c=D.customers.find(x=>x.id===cid);
  if(!c){renderVisits();return}
  $('visits').innerHTML='<h2>📝 拜访报告</h2><div class="card"><div class="item"><b>'+esc(c.name)+'</b> <span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+'</span></div>'+
   '<label style="margin-top:10px">见到老板？</label><select id="v_owner"><option value="1">是</option><option value="0">否</option></select>'+
   '<label>客户需求</label><textarea id="v_need"></textarea>'+
   '<label>客户反馈</label><textarea id="v_fb"></textarea>'+
   '<label>竞品 / 价格</label><input id="v_comp" value="'+esc(c.competitor||'')+'">'+
   '<label>潜在订单 RM</label><input id="v_pot" type="number" min="0" step="0.01" inputmode="decimal" value="0">'+
   '<label>下一次跟进</label><input id="v_fu" type="date">'+
   '<label style="display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400"><input id="v_gps" type="checkbox" checked style="width:auto;margin:0"> 同时记录我现在的 GPS 位置</label>'+
   '<div class="row" style="margin-top:10px"><button class="btn" onclick="saveVisit(\''+esc(cid)+'\')">保存拜访</button><button class="btn secondary" onclick="renderVisits()">取消</button></div></div>';
}
async function saveVisit(cid){
  const pot=Number($('v_pot').value||0);
  if(!(pot>=0)){toast('潜在订单金额不正确');return}
  const wantGps=$('v_gps').checked;
  const base={customer_id:cid,sales_id:me.id,met_owner:$('v_owner').value==='1',need:$('v_need').value.trim(),feedback:$('v_fb').value.trim(),
    competitor:$('v_comp').value.trim(),potential_order:pot,next_follow_up:$('v_fu').value||null};
  await guard(async()=>{
    let gpsFailed=false;
    if(wantGps){
      toast('正在获取位置…');
      try{const p=await getPos(8000);base.lat=p.coords.latitude;base.lng=p.coords.longitude}catch(e){gpsFailed=true}
    }
    const r=await sb.from('visits').insert(base);
    if(r.error)throw r.error;
    if(base.next_follow_up){
      const u=await sb.from('customers').update({follow_up:base.next_follow_up}).eq('id',cid);
      if(u.error)throw u.error;
    }
    await loadAll();renderVisits();
    toast(gpsFailed?'拜访已保存（未能取得 GPS 位置）':'拜访记录已保存');
  });
}

/* ========== 管理员后台 ========== */
function renderAdmin(){
  if(!isAdmin()){$('admin').innerHTML='<h2>⚙️ 后台</h2><div class="card">只有管理员可以使用后台。</div>';return}
  const sales=salesList();
  const staff=sales.map(u=>{
    const ins=D.attendance.some(a=>a.user_id===u.id&&a.type==='IN'&&isToday(a.created_at));
    return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+(ins?'✅':'—')+'</td><td>'+D.customers.filter(c=>c.owner_id===u.id).length+'</td><td>'+D.visits.filter(v=>v.sales_id===u.id).length+'</td></tr>';
  }).join('');
  const custRows=D.customers.map(c=>{
    const opts=D.profiles.filter(p=>(p.role==='sales'&&p.active)||p.id===c.owner_id);
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.grade)+'</td><td><select onchange="reassign(\''+esc(c.id)+'\',this.value)">'+opts.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===c.owner_id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></td><td>'+esc(c.follow_up||'-')+'</td><td><button class="btn secondary" style="padding:6px 10px" onclick="customerForm(\''+esc(c.id)+'\')">编辑</button></td></tr>';
  }).join('');
  $('admin').innerHTML='<h2>⚙️ Admin 后台</h2>'+
   '<div class="card"><h3>Sales 管理</h3><div class="table"><table><tr><th>姓名</th><th>账号</th><th>今日打卡</th><th>客户数</th><th>拜访数</th></tr>'+staff+'</table></div>'+
   '<p class="muted">新增 / 停用 / 重置密码，请到 Supabase 后台的 Authentication → Users 操作。</p></div>'+
   '<div class="card"><h3>全部客户与负责人（可直接重新分配）</h3><div class="table"><table><tr><th>客户</th><th>等级</th><th>所属 Sales</th><th>跟进</th><th></th></tr>'+(custRows||'<tr><td colspan="5" class="muted">暂无客户</td></tr>')+'</table></div></div>'+
   '<div class="card"><h3>数据备份</h3><button class="btn secondary" onclick="backup()">导出 JSON 备份</button><p class="muted">导出当前可见的全部客户、拜访、打卡（最近 1000 条）记录。</p></div>';
}
async function reassign(cid,oid){
  await guard(async()=>{
    const r=await sb.from('customers').update({owner_id:oid}).eq('id',cid);
    if(r.error)throw r.error;
    await loadAll();renderAdmin();toast('已重新分配负责 Sales');
  });
}
function backup(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),profiles:D.profiles,customers:D.customers,visits:D.visits,attendance:D.attendance},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='AKAIDO-backup-'+ymd()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ========== 启动 ========== */
(async function init(){
  ['lu','lp'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()}));
  if(!window.supabase){loginMsg('无法加载网络组件，请检查网络后刷新页面');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;location.reload()}});
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await enter(data.session.user);
  }catch(e){console.error(e);loginMsg('自动登录失败，请重新登录')}
})();
</script>
